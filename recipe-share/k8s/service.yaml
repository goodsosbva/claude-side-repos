# 클러스터 내부용 ClusterIP 와, 브라우저로 바로 접속할 NodePort 를 따로 둔다.
# port-forward 만 쓸 것이면 NodePort 쪽은 지워도 무방하다.
apiVersion: v1
kind: Service
metadata:
  name: recipe-share-web
  namespace: recipe-share
  labels:
    app.kubernetes.io/name: recipe-share
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recipe-share
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-share-web-nodeport
  namespace: recipe-share
  labels:
    app.kubernetes.io/name: recipe-share
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: recipe-share
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      # http://localhost:30300 (Docker Desktop / minikube tunnel 기준)
      nodePort: 30300
